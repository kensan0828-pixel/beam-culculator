<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>単純梁計算 - 等分布荷重</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

body {
min-height: 100vh;
background: #0f1923;
font-family: ‘Noto Sans JP’, sans-serif;
color: #e0e6ed;
padding: 20px 16px 40px;
}

h1 {
text-align: center;
font-size: 20px;
font-weight: 700;
margin-bottom: 4px;
color: #fff;
}

.subtitle {
text-align: center;
font-size: 12px;
color: #6b8299;
margin-bottom: 24px;
}

.card {
background: #182635;
border-radius: 14px;
padding: 20px;
margin-bottom: 16px;
border: 1px solid rgba(255,255,255,.06);
}

.card-title {
font-size: 13px;
font-weight: 600;
color: #4da6e8;
margin-bottom: 14px;
letter-spacing: .04em;
}

.input-grid {
display: grid;
grid-template-columns: minmax(0, 1fr) 80px 44px;
column-gap: 8px;
row-gap: 12px;
align-items: center;
margin-bottom: 16px;
}

.input-grid .lbl {
font-size: 13px;
color: #a0b4c8;
}

.input-grid .unit {
font-family: ‘JetBrains Mono’, monospace;
font-size: 11px;
color: #5a7a94;
white-space: nowrap;
text-align: right;
}

input[type=”number”] {
width: 100%;
padding: 12px 10px;
min-width: 0;
background: #0f1923;
border: 1px solid #2a3f52;
border-radius: 8px;
color: #fff;
font-family: ‘JetBrains Mono’, monospace;
font-size: 16px;
outline: none;
transition: border-color .2s;
text-align: right;
-webkit-appearance: none;
-moz-appearance: textfield;
appearance: none;
}

input:focus {
border-color: #4da6e8;
}

.beam-diagram {
text-align: center;
padding: 10px 0;
}

.beam-diagram svg {
width: 100%;
max-width: 320px;
height: auto;
}

.result-list {
display: flex;
flex-direction: column;
gap: 0;
}

.result-row {
display: flex;
justify-content: space-between;
align-items: baseline;
padding: 10px 4px;
border-bottom: 1px solid rgba(255,255,255,.05);
font-size: 14px;
}

.result-row:last-child { border-bottom: none; }

.result-row .label {
color: #a0b4c8;
}

.result-row .value {
font-family: ‘JetBrains Mono’, monospace;
font-weight: 600;
color: #4da6e8;
}

button {
width: 100%;
padding: 14px;
background: linear-gradient(135deg, #4da6e8, #3578b2);
border: none;
border-radius: 10px;
color: #fff;
font-family: ‘Noto Sans JP’, sans-serif;
font-size: 15px;
font-weight: 600;
cursor: pointer;
transition: transform .15s;
margin-top: 4px;
}

button:active { transform: scale(.97); }

.note {
text-align: center;
font-size: 11px;
color: #4a6478;
margin-top: 12px;
}
</style>

</head>
<body>

<h1>単純梁の構造計算</h1>
<p class="subtitle">等分布荷重 Simply Supported Beam</p>

<div class="card">
  <div class="card-title">▼ 梁ダイアグラム</div>
  <div class="beam-diagram">
    <svg viewBox="0 0 320 130">
      <!-- 左：ピン支点 -->
      <polygon points="40,70 30,90 50,90" fill="none" stroke="#4da6e8" stroke-width="2"/>
      <!-- 右：ローラー支点 -->
      <polygon points="280,70 270,90 290,90" fill="none" stroke="#4da6e8" stroke-width="2"/>
      <line x1="268" y1="93" x2="292" y2="93" stroke="#4da6e8" stroke-width="1.5"/>
      <!-- 梁 -->
      <line x1="40" y1="70" x2="280" y2="70" stroke="#e0e6ed" stroke-width="3" stroke-linecap="round"/>
      <!-- 等分布荷重の矢印 -->
      <line x1="40" y1="30" x2="280" y2="30" stroke="#5cf0a8" stroke-width="1.5"/>
      <line x1="40" y1="30" x2="40" y2="65" stroke="#5cf0a8" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="80" y1="30" x2="80" y2="65" stroke="#5cf0a8" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="120" y1="30" x2="120" y2="65" stroke="#5cf0a8" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="160" y1="30" x2="160" y2="65" stroke="#5cf0a8" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="200" y1="30" x2="200" y2="65" stroke="#5cf0a8" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="240" y1="30" x2="240" y2="65" stroke="#5cf0a8" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="280" y1="30" x2="280" y2="65" stroke="#5cf0a8" stroke-width="1" marker-end="url(#arrow)"/>
      <defs>
        <marker id="arrow" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
          <path d="M0,0 L6,3 L0,6 Z" fill="#5cf0a8"/>
        </marker>
      </defs>
      <!-- ラベル -->
      <text x="160" y="20" text-anchor="middle" fill="#5cf0a8" font-size="12" font-family="JetBrains Mono">w (kN/m)</text>
      <text x="160" y="120" text-anchor="middle" fill="#6b8299" font-size="12" font-family="JetBrains Mono">L (mm)</text>
      <!-- 寸法線 -->
      <line x1="40" y1="110" x2="280" y2="110" stroke="#6b8299" stroke-width="0.8"/>
      <line x1="40" y1="106" x2="40" y2="114" stroke="#6b8299" stroke-width="0.8"/>
      <line x1="280" y1="106" x2="280" y2="114" stroke="#6b8299" stroke-width="0.8"/>
    </svg>
  </div>
</div>

<div class="card">
  <div class="card-title">▼ 入力条件</div>
  <div class="input-grid">
    <span class="lbl">スパン</span>
    <input type="number" id="span" value="6000" step="100">
    <span class="unit">mm</span>

    <span class="lbl">等分布荷重</span>
    <input type="number" id="load" value="5.0" step="0.1">
    <span class="unit">kN/m</span>

    <span class="lbl">断面二次モーメント</span>
    <input type="number" id="inertia" value="10000" step="100">
    <span class="unit">cm⁴</span>

    <span class="lbl">断面係数</span>
    <input type="number" id="section" value="500" step="10">
    <span class="unit">cm³</span>

    <span class="lbl">ヤング係数</span>
    <input type="number" id="young" value="10.5" step="0.1">
    <span class="unit">kN/mm²</span>
  </div>
  <button onclick="calculate()">計 算</button>
</div>

<div class="card" id="results" style="display:none;">
  <div class="card-title">▼ 計算結果</div>
  <div class="result-list" id="result-list"></div>
</div>

<p class="note">※ 自重は含まれていません</p>

<script>
function calculate() {
  const L_mm = parseFloat(document.getElementById('span').value);
  const w = parseFloat(document.getElementById('load').value);       // kN/m
  const I = parseFloat(document.getElementById('inertia').value);    // cm4
  const Z = parseFloat(document.getElementById('section').value);    // cm3
  const E = parseFloat(document.getElementById('young').value);      // kN/mm2

  const L_m = L_mm / 1000;

  // 反力・せん断力 (kN)
  const R = (w * L_m) / 2;

  // 最大曲げモーメント (kN·m)
  const M = (w * L_m * L_m) / 8;

  // 最大曲げ応力度 (N/mm2)
  // M(kN·m) → M*10^6 (N·mm), Z(cm3) → Z*10^3 (mm3)
  const sigma = (M * 1e6) / (Z * 1e3);

  // 最大たわみ (mm)
  // w(kN/m) → w(N/mm) = w/1000*1000/1000 = w*1 → w (kN/m) = w/1000 (kN/mm)
  // → w(N/mm) = w * 1000 / 1000 = w (N/mm)... 
  // w(kN/m) = w * 10^-3 (kN/mm)
  // I(cm4) = I * 10^4 (mm4)
  // E(kN/mm2)
  // δ = 5wL^4 / (384EI)
  // w in kN/mm, L in mm, E in kN/mm2, I in mm4
  const w_kN_mm = w / 1e3; // kN/m → kN/mm
  const I_mm4 = I * 1e4;   // cm4 → mm4
  const delta = (5 * w_kN_mm * Math.pow(L_mm, 4)) / (384 * E * I_mm4);

  // たわみ/スパン比
  const ratio = L_mm / delta;

  // たわみ制限
  const limit = L_mm / 300;

  // 表示
  document.getElementById('results').style.display = 'block';

  const deltaColor = delta <= limit ? '#5cf0a8' : '#e85454';
  const rows = [
    ['反力 R (wL/2)', R.toFixed(2) + ' kN'],
    ['最大せん断力 Q (wL/2)', R.toFixed(2) + ' kN'],
    ['最大曲げモーメント M (wL²/8)', M.toFixed(2) + ' kN·m'],
    ['最大曲げ応力度 σ (M/Z)', sigma.toFixed(2) + ' N/mm²'],
    ['最大たわみ δ (5wL⁴/384EI)', delta.toFixed(2) + ' mm', deltaColor],
    ['たわみ/スパン比', '1/' + Math.round(ratio)],
    ['たわみ制限 L/300', limit.toFixed(1) + ' mm'],
  ];

  const list = document.getElementById('result-list');
  list.innerHTML = rows.map(r => {
    const color = r[2] || '#4da6e8';
    return `<div class="result-row"><span class="label">${r[0]}</span><span class="value" style="color:${color}">${r[1]}</span></div>`;
  }).join('');

  // スクロール
  document.getElementById('results').scrollIntoView({ behavior: 'smooth' });
}

// 初回計算
calculate();
</script>

</body>
</html>
